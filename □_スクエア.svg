  <line x1="60" y1="50" x2="150" y2="140" stroke="#bbb" stroke-width="0.5"/>
  <line x1="150" y1="50" x2="60" y2="140" stroke="#bbb" stroke-width="0.5"/>
  <line x1="60" y1="155" x2="150" y2="155" stroke="#555" stroke-width="0.8"/>
